services:
  user-auth-react:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: user-auth-frontend

    restart: unless-stopped

    ports:
      - "8083:80"

    networks:
      - user-auth-network

networks:
  user-auth-network:
    external: true
    name: user-auth-node-mysql_user-auth-network